<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ergast Lap Data Test</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 { color: #2c3e50; }
        .status { 
            padding: 1rem; 
            margin: 1rem 0; 
            border-radius: 4px;
            font-weight: 600;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .loading { background: #d1ecf1; color: #0c5460; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #34495e;
            color: white;
        }
        tr:hover {
            background: #f8f9fa;
        }
        code {
            background: #f4f4f4;
            padding: 0.25rem 0.5rem;
            border-radius: 3px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏎️ Ergast API Lap Data Test</h1>
        <p>Testing the fixed lap data interface for F1 Panopticon</p>
        
        <div id="status" class="status loading">
            ⏳ Loading lap data from Ergast API...
        </div>
        
        <div id="details"></div>
        <div id="results"></div>
    </div>

    <script>
        const API_URL = 'https://api.jolpi.ca/ergast/f1/2024/1/laps.json?limit=50';
        
        async function testLapData() {
            const statusEl = document.getElementById('status');
            const detailsEl = document.getElementById('details');
            const resultsEl = document.getElementById('results');
            
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                // Verify structure matches our interface
                const hasRaceTable = !!data.MRData?.RaceTable;
                const hasRaces = Array.isArray(data.MRData?.RaceTable?.Races);
                const hasLaps = Array.isArray(data.MRData?.RaceTable?.Races?.[0]?.Laps);
                
                if (!hasRaceTable || !hasRaces || !hasLaps) {
                    throw new Error('API structure does not match expected format');
                }
                
                const race = data.MRData.RaceTable.Races[0];
                const laps = race.Laps;
                
                statusEl.className = 'status success';
                statusEl.innerHTML = '✅ Successfully loaded lap data!';
                
                detailsEl.innerHTML = `
                    <h2>Race Details</h2>
                    <p><strong>Race:</strong> ${race.raceName}</p>
                    <p><strong>Circuit:</strong> ${race.Circuit.circuitName}</p>
                    <p><strong>Date:</strong> ${race.date}</p>
                    <p><strong>Total Laps Fetched:</strong> ${laps.length}</p>
                    <p><strong>API Structure:</strong> <code>MRData.RaceTable.Races[0].Laps</code> ✅</p>
                `;
                
                // Display first 10 lap timings
                let tableHTML = '<h2>Sample Lap Times (First 10)</h2><table><thead><tr><th>Lap</th><th>Driver</th><th>Position</th><th>Time</th></tr></thead><tbody>';
                
                laps.slice(0, 10).forEach(lap => {
                    lap.Timings.slice(0, 3).forEach(timing => {
                        tableHTML += `
                            <tr>
                                <td>${lap.number}</td>
                                <td>${timing.driverId}</td>
                                <td>${timing.position}</td>
                                <td>${timing.time}</td>
                            </tr>
                        `;
                    });
                });
                
                tableHTML += '</tbody></table>';
                resultsEl.innerHTML = tableHTML;
                
            } catch (error) {
                statusEl.className = 'status error';
                statusEl.innerHTML = `❌ Error: ${error.message}`;
                detailsEl.innerHTML = `<p>Failed to load lap data. Check console for details.</p>`;
                console.error('Error:', error);
            }
        }
        
        testLapData();
    </script>
</body>
</html>
